name = "invis-fielding-signup"
main = "worker.js"
compatibility_date = "2026-10-03"

[vars]
ALLOWED_ORIGINS = "https://kenn20.github.io"

[[d1_databases]]
binding = "DB"
database_name = "invis-fielding-signups"
database_id = "a2ba717d-e248-437e-9b19-bd7b35821fe3"
migrations_dir = "migrations"

[[ratelimits]]
name = "SIGNUP_RATE_LIMITER"
namespace_id = "10012026"
simple = { limit = 10, period = 60 }

[observability]
enabled = true

[observability.traces]
enabled = true
